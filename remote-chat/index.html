<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1020">
  <meta name="description" content="Remote Team Chat">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
  <title>Remote Chat</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">TEAM CHAT</p>
        <h1>Remote Chat</h1>
      </div>
      <button id="settings-toggle" class="icon-button" type="button" aria-label="Connection settings">Settings</button>
    </header>

    <section id="connection-panel" class="connection-panel" aria-labelledby="connection-title">
      <div class="panel-heading">
        <h2 id="connection-title">Connection</h2>
        <button id="close-settings" class="text-button" type="button">Close</button>
      </div>
      <form id="connection-form">
        <label>
          API base URL
          <input id="api-base" type="url" inputmode="url" placeholder="https://desktop.tailnet.ts.net" required>
        </label>
        <label>
          Bearer token
          <input id="token" type="password" autocomplete="off" spellcheck="false" required>
        </label>
        <p class="hint">The token is kept only until this browser tab is closed.</p>
        <button type="submit">Connect</button>
      </form>
    </section>

    <section class="agent-area" aria-label="Agent controls">
      <label class="agent-filter" for="agent-filter">
        Send to
        <select id="agent-filter" disabled>
          <option value="">All agents</option>
        </select>
      </label>
      <div id="agent-roster" class="agent-roster" aria-live="polite">
        <p class="roster-empty">Agent roster will appear when connected.</p>
      </div>
    </section>

    <section id="attention-area" class="attention-area" aria-labelledby="attention-title" hidden>
      <div class="attention-heading">
        <h2 id="attention-title">Needs attention</h2>
        <span id="attention-count" class="attention-count"></span>
      </div>
      <p id="attention-status" class="attention-status" role="status" aria-live="polite"></p>
      <div id="request-list" class="request-list"></div>
    </section>

    <section class="chat" aria-label="Messages">
      <div id="status" class="status" role="status" aria-live="polite">Configure a connection to begin.</div>
      <div id="delivery-status" class="delivery-status" aria-live="polite"></div>
      <ol id="messages" class="messages" aria-live="polite"></ol>
    </section>

    <form id="message-form" class="composer">
      <label class="sr-only" for="message-content">Message</label>
      <textarea id="message-content" rows="2" maxlength="8192" placeholder="Write a message" disabled required></textarea>
      <button id="send-button" type="submit" disabled>Send</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
